name: Static and safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4 whiptail fzf python3-tomlkit
      - run: bash tests/check.sh
  fedora-packages:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Native package installation and language compilation
        env:
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: bash tests/fedora-packages.sh

  dms-packages:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install and repeat upstream DMS stable RPMs
        env:
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: bash tests/dms-packages.sh

  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Kitty, fonts, Flea, VS Code, LazyVim and run the unified updater
        env:
          FEDORA_POSTINSTALL_GITHUB_TOKEN: ${{ github.token }}
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: bash tests/experience.sh

  omasnap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Omasnap, run upstream tests, retain custom config and repeat
        env:
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: bash tests/omasnap-packages.sh
