name: Application installation smoke
on: workflow_dispatch
permissions:
  contents: read
jobs:
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    container:
      image: fedora:${{ matrix.fedora }}
      # Flatpak's extra-data deployment uses bubblewrap namespaces. This is an
      # ephemeral hosted runner, never a request to change the user's host.
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable user and session bus
        run: |
          dnf5 -y install flatpak dbus-daemon util-linux shadow-utils sudo curl python3 xdg-utils
          useradd --create-home tester
          printf 'tester ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-disposable-test
          chmod 0440 /etc/sudoers.d/90-disposable-test
      - name: Install selected applications without a terminal
        env:
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: runuser -u tester -- dbus-run-session bash tests/flatpak-apps.sh
      - name: Install vendor RPMs and verify browser/editor defaults
        env:
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: |
          set +e
          yes YES | runuser -u tester -- dbus-run-session bash tests/vendor-rpms.sh
          result=${PIPESTATUS[1]}
          exit "$result"
        shell: bash
      - name: Prepare native OBS and FFmpeg
        run: dnf5 -y install obs-studio ffmpeg-free
      - name: Verify real H.264 encoding and codec rerun
        env:
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: |
          set +e
          yes YES | runuser -u tester -- dbus-run-session bash tests/obs-codec.sh
          result=${PIPESTATUS[1]}
          exit "$result"
        shell: bash

      - name: Run centralized updater with real user Flatpaks and vendor RPMs
        env:
          FEDORA_POSTINSTALL_TEST_TARGET: disposable
        run: runuser -u tester -- dbus-run-session bash tests/update-stack.sh
